<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Perk · 老友记 3D</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://fastly.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://fastly.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="cafe-canvas"></canvas>

  <!-- ========== UI OVERLAY ========== -->
  <div class="ui-topbar">
    <h1 class="cafe-title">Central Perk</h1>
    <p class="cafe-subtitle">老友记 3D 咖啡馆 · 拖拽旋转视角</p>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="time-toggle" title="切换时段">☀️</button>
    <button class="ctrl-btn" id="search-btn" title="搜索台词">🔍</button>
    <button class="ctrl-btn" id="vocab-btn" title="生词本">📖</button>
  </div>

  <!-- 台词气泡（HTML overlay，跟随3D角色位置投影） -->
  <div id="bubble-layer" class="bubble-layer"></div>

  <!-- 大台词弹窗 -->
  <div id="big-quote" class="big-quote hidden">
    <div class="big-quote-card">
      <span class="bq-char"></span>
      <p class="bq-text"></p>
      <button id="big-quote-close" class="bq-close">×</button>
    </div>
  </div>

  <!-- 搜索面板 -->
  <div id="search-overlay" class="panel-overlay hidden">
    <div class="panel-inner">
      <div class="panel-header">
        <h2>搜索台词</h2>
        <button id="search-close" class="panel-close">×</button>
      </div>
      <input id="search-input" type="text" placeholder="搜索台词..." autocomplete="off">
      <div class="hot-searches" id="hot-searches"></div>
      <div class="filter-row">
        <select id="season-filter"><option value="">全部季</option></select>
        <select id="episode-filter"><option value="">全部集</option></select>
      </div>
      <div id="results-count" class="results-count hidden"></div>
      <div id="search-results" class="search-results"></div>
      <div id="search-empty" class="search-empty hidden">没有找到匹配的台词</div>
    </div>
  </div>

  <!-- 生词本面板 -->
  <div id="vocab-overlay" class="panel-overlay hidden">
    <div class="panel-inner">
      <div class="panel-header">
        <h2>我的生词本</h2>
        <button id="vocab-close" class="panel-close">×</button>
      </div>
      <div id="vocab-list" class="vocab-list"></div>
      <button id="vocab-clear" class="clear-btn">清空全部生词</button>
    </div>
  </div>

  <div id="panel-overlay" class="panel-overlay-bg hidden"></div>
  <div class="flash-msg"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
